[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "txshield"
version = "0.1.0"
description = "Transaction-level RAG-enabled DeFi attack detection"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["defi", "security", "rag", "transaction-analysis", "xgboost"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security"
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]
ollama = ["langchain-ollama>=0.1,<0.4"]
local-llm = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.33"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
rag = ["pandas>=2.0", "requests>=2.31", "python-dotenv>=1.0", "langchain-core>=0.2,<0.4", "langchain-chroma>=0.1,<0.3", "chromadb>=0.5", "langchain-openai>=0.1,<0.4"]

[project.scripts]
txshield = "txshield.cli:main"

[project.urls]
Repository = "https://github.com/oumo0/TxShield"
Issues = "https://github.com/oumo0/TxShield/issues"

[tool.setuptools.packages.find]
where = ["src"]

