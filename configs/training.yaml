training_mode: paper
random_seed: 42
validation_size: 0.2
cv_folds: 5
scoring: f1
model:
  n_estimators: 500
  eval_metric: logloss
  n_jobs: -1
  verbosity: 0
  max_depth: 3
  learning_rate: 0.02
  min_child_weight: 1
  subsample: 0.9
  colsample_bytree: 0.7
  reg_alpha: 0
  reg_lambda: 0.5
paths:
  train: data/processed/train
  test: data/processed/test
  model: artifacts/models/xgb_final_model.pkl
  threshold: artifacts/thresholds/best_threshold.txt
  report_dir: artifacts/reports
